[package]
name = "app"
version = "0.1.0"
description = "AniHub — смотрим вместе (Tauri). Окно поверх фронт-сервера localhost:3000."
authors = ["you"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

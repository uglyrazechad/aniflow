name: aniflow

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SITE_URL: https://${SITE_HOST:?Укажите SITE_HOST в .env}
      ANIMEGO_MIRROR: ${ANIMEGO_MIRROR:-https://animego.me}
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_HOST: ${SITE_HOST:?Укажите SITE_HOST в .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
